name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  lint:
    name: Typing & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Ruff check
        run: ruff check custom_components tests

      - name: Ruff format check
        run: ruff format --check custom_components tests

      - uses: astral-sh/setup-uv@v7

      # Type-checked against the OLDEST HA this integration can load on, not the
      # newest release: HA 2026.9 moved core to probatio and 2026.10 retyped schema
      # arguments as probatio.Schema, so mypy against the latest HA rejects the
      # voluptuous schemas older releases need. HA still accepts voluptuous schemas
      # at runtime; the tests job covers runtime on the newest HA.
      # NOTE: hacs.json says 2024.12.0, but AddConfigEntryEntitiesCallback (imported
      # at module level) only exists from HA 2025.3, and 2025.3.x no longer installs
      # (it pins a yanked aiohttp), so 2025.4.0 is the oldest version that can be
      # checked. Correcting the declared floor is an open item.
      - name: Mypy (strict via pyproject)
        run: >-
          uv run --no-project --python 3.13 --prerelease=allow
          --with mypy --with homeassistant==2025.4.0 --with voluptuous
          mypy custom_components/sensoredlife/

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Pytest with coverage gate
        run: pytest tests -q --cov=custom_components.sensoredlife --cov-fail-under=95

  syntax-floor:
    # The oldest supported HA (2024.12) runs Python 3.12 — make sure every
    # shipped module still parses there, so a formatter/lint pass can never
    # smuggle in newer-only syntax (e.g. PEP 758 unparenthesized except).
    name: Syntax floor (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile on the support floor
        run: python -m compileall -q custom_components/
